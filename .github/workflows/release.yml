name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Package resource
        run: |
          mkdir -p package/pg-wrapper
          cp -r dist package/pg-wrapper/
          cp -r web package/pg-wrapper/
          cp fxmanifest.lua package/pg-wrapper/
          cp README.md LICENSE package/pg-wrapper/
          cd package
          zip -r "../pg-wrapper-${GITHUB_REF_NAME}.zip" pg-wrapper

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pg-wrapper-${{ github.ref_name }}.zip
          generate_release_notes: true
